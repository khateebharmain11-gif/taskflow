<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow | Premium To-Do List</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #f4f5fb;
            font-family: 'Segoe UI', sans-serif;
            color: #20243a;
        }

        /* Navbar */

        .navbar {
            background: #ffffff;
            padding: 18px 0;
            box-shadow: 0 3px 20px rgba(0,0,0,0.04);
        }

        .brand {
            font-size: 24px;
            font-weight: 800;
            color: #6658e8;
            letter-spacing: -1px;
        }

        .brand span {
            color: #25283d;
        }

        .nav-tag {
            background: #f0edff;
            color: #6658e8;
            padding: 7px 14px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 700;
        }

        /* Main Container */

        .main-container {
            max-width: 850px;
            margin: 65px auto;
            padding: 0 18px;
        }

        .welcome-text {
            font-size: 14px;
            color: #85899d;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .main-heading {
            font-size: clamp(30px, 5vw, 42px);
            font-weight: 800;
            letter-spacing: -1.5px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #85899d;
            font-size: 15px;
            margin-bottom: 30px;
        }

        /* Dashboard Card */

        .todo-card {
            background: #ffffff;
            border-radius: 22px;
            padding: 30px;
            box-shadow: 0 12px 45px rgba(38, 35, 80, 0.07);
            border: 1px solid #eeeef5;
        }

        /* Statistics */

        .stats-box {
            background: linear-gradient(135deg, #6d5ce8, #9180ff);
            color: white;
            border-radius: 17px;
            padding: 22px;
            margin-bottom: 28px;
        }

        .stats-label {
            font-size: 13px;
            opacity: 0.85;
        }

        .stats-number {
            font-size: 32px;
            font-weight: 800;
            margin-top: 5px;
        }

        .progress {
            height: 7px;
            background: rgba(255,255,255,0.25);
            border-radius: 20px;
            margin-top: 15px;
        }

        .progress-bar {
            background: #ffffff;
            border-radius: 20px;
            transition: width 0.4s ease;
        }

        /* Input Section */

        .section-title {
            font-size: 17px;
            font-weight: 750;
            margin-bottom: 15px;
        }

        .input-group-custom {
            display: flex;
            gap: 10px;
            margin-bottom: 28px;
        }

        .task-input {
            flex: 1;
            min-width: 0;
            border: 1px solid #e7e7f0;
            background: #fafaff;
            border-radius: 12px !important;
            padding: 14px 16px;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        .task-input:focus {
            border-color: #7565ef;
            box-shadow: 0 0 0 3px rgba(117,101,239,0.12);
        }

        .add-btn {
            background: #6d5ce8;
            border: none;
            color: white;
            padding: 0 23px;
            border-radius: 12px;
            font-weight: 700;
            transition: 0.3s;
            white-space: nowrap;
        }

        .add-btn:hover {
            background: #5745d1;
            transform: translateY(-2px);
        }

        /* Filter Buttons */

        .filter-container {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }

        .filter-btn {
            border: none;
            background: #f3f3f9;
            color: #85899d;
            border-radius: 9px;
            padding: 9px 17px;
            font-size: 13px;
            font-weight: 650;
            transition: 0.3s;
        }

        .filter-btn.active {
            background: #6d5ce8;
            color: white;
        }

        /* Task List */

        .task-item {
            display: flex;
            align-items: center;
            gap: 13px;
            padding: 17px 15px;
            background: #fafaff;
            border: 1px solid #eeeef5;
            border-radius: 13px;
            margin-bottom: 11px;
            animation: slideIn 0.3s ease;
            transition: 0.25s;
        }

        .task-item:hover {
            border-color: #d9d2ff;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.03);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .task-checkbox {
            width: 19px;
            height: 19px;
            accent-color: #6d5ce8;
            cursor: pointer;
            flex-shrink: 0;
        }

        .task-text {
            flex: 1;
            min-width: 0;
            font-size: 14px;
            font-weight: 600;
            overflow-wrap: anywhere;
        }

        .completed .task-text {
            text-decoration: line-through;
            color: #a4a5b3;
        }

        .delete-btn {
            border: none;
            background: #fff0f0;
            color: #e15b67;
            width: 35px;
            height: 35px;
            border-radius: 9px;
            font-size: 16px;
            transition: 0.3s;
            flex-shrink: 0;
        }

        .delete-btn:hover {
            background: #e15b67;
            color: white;
        }

        /* Empty State */

        .empty-state {
            text-align: center;
            padding: 40px 10px;
            color: #999bad;
        }

        .empty-icon {
            font-size: 42px;
            margin-bottom: 12px;
        }

        .empty-state h5 {
            font-size: 16px;
            font-weight: 700;
            color: #51546b;
        }

        .empty-state p {
            font-size: 13px;
            margin-top: 6px;
        }

        /* Footer */

        .footer-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid #eeeef5;
            gap: 10px;
        }

        .task-count {
            color: #9294a6;
            font-size: 12px;
        }

        .clear-btn {
            border: none;
            background: transparent;
            color: #e15b67;
            font-size: 12px;
            font-weight: 700;
        }

        .clear-btn:hover {
            text-decoration: underline;
        }

        /* Toast Message */

        .toast-message {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: #25283d;
            color: white;
            padding: 13px 20px;
            border-radius: 12px;
            font-size: 13px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            opacity: 0;
            transform: translateY(15px);
            pointer-events: none;
            transition: 0.3s;
            z-index: 1000;
        }

        .toast-message.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* Responsive Design */

        @media(max-width: 576px) {
            .main-container {
                margin: 35px auto;
            }

            .todo-card {
                padding: 20px 15px;
                border-radius: 17px;
            }

            .stats-box {
                padding: 18px;
            }

            .add-btn {
                padding: 0 15px;
                font-size: 13px;
            }

            .task-item {
                padding: 14px 10px;
                gap: 9px;
            }

            .filter-btn {
                padding: 8px 13px;
            }

            .toast-message {
                left: 15px;
                right: 15px;
                text-align: center;
                bottom: 15px;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="container d-flex justify-content-between align-items-center">
            <div class="brand">Task<span>Flow.</span></div>
            <div class="nav-tag">✦ PRODUCTIVITY APP</div>
        </div>
    </nav>

    <!-- Main Section -->
    <main class="main-container">

        <div class="welcome-text">YOUR PERSONAL WORKSPACE ✨</div>

        <h1 class="main-heading">Get things done.</h1>

        <p class="subtitle">
            Organize your day, focus on what matters, and achieve more.
        </p>

        <!-- Todo Dashboard -->
        <div class="todo-card">

            <!-- Statistics -->
            <div class="stats-box">

                <div class="d-flex justify-content-between align-items-center">

                    <div>
                        <div class="stats-label">YOUR PROGRESS</div>
                        <div class="stats-number" id="progressText">0%</div>
                    </div>

                    <div class="text-end">
                        <div class="stats-label">COMPLETED TASKS</div>
                        <div class="stats-number" id="completedCount">0/0</div>
                    </div>

                </div>

                <div class="progress">
                    <div class="progress-bar"
                         id="progressBar"
                         style="width: 0%">
                    </div>
                </div>

            </div>

            <!-- Add Task -->
            <h5 class="section-title">Add a new task</h5>

            <div class="input-group-custom">

                <input
                    type="text"
                    class="task-input"
                    id="taskInput"
                    placeholder="What needs to be done?"
                    maxlength="150"
                >

                <button class="add-btn" onclick="addTask()">
                    + Add Task
                </button>

            </div>

            <!-- Task Filters -->
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">

                <h5 class="section-title mb-0">My Tasks</h5>

                <span class="task-count" id="totalCount">
                    0 tasks
                </span>

            </div>

            <div class="filter-container">

                <button class="filter-btn active"
                        onclick="filterTasks('all', this)">
                    All
                </button>

                <button class="filter-btn"
                        onclick="filterTasks('active', this)">
                    Active
                </button>

                <button class="filter-btn"
                        onclick="filterTasks('completed', this)">
                    Completed
                </button>

            </div>

            <!-- Task List -->
            <div id="taskList"></div>

            <!-- Footer -->
            <div class="footer-actions">

                <span class="task-count" id="remainingCount">
                    0 tasks remaining
                </span>

                <button class="clear-btn" onclick="clearCompleted()">
                    Clear completed
                </button>

            </div>

        </div>

    </main>

    <!-- Toast -->
    <div class="toast-message" id="toast"></div>


    <!-- JavaScript -->
    <script>

        // Load saved tasks from Local Storage

        let tasks = JSON.parse(localStorage.getItem("myTasks")) || [];

        let currentFilter = "all";

        // Save tasks

        function saveTasks() {
            localStorage.setItem("myTasks", JSON.stringify(tasks));
        }

        // Show notification

        function showToast(message) {

            const toast = document.getElementById("toast");

            toast.textContent = message;
            toast.classList.add("show");

            setTimeout(() => {
                toast.classList.remove("show");
            }, 2200);
        }

        // Add Task

        function addTask() {

            const input = document.getElementById("taskInput");

            const taskText = input.value.trim();

            if (taskText === "") {
                showToast("Please enter a task first!");
                input.focus();
                return;
            }

            const task = {
                id: Date.now() + Math.random(),
                text: taskText,
                completed: false
            };

            tasks.unshift(task);

            saveTasks();

            input.value = "";

            renderTasks();

            showToast("Task added successfully! ✓");

            input.focus();
        }

        // Add task using Enter key

        document.getElementById("taskInput")
            .addEventListener("keydown", function(event) {

                if (event.key === "Enter") {
                    addTask();
                }

            });

        // Delete Task

        function deleteTask(id) {

            tasks = tasks.filter(task => task.id !== id);

            saveTasks();

            renderTasks();

            showToast("Task deleted successfully!");
        }

        // Toggle Completed Status

        function toggleTask(id) {

            tasks = tasks.map(task => {

                if (task.id === id) {
                    task.completed = !task.completed;
                }

                return task;

            });

            saveTasks();

            renderTasks();
        }

        // Filter Tasks

        function filterTasks(filter, button) {

            currentFilter = filter;

            document.querySelectorAll(".filter-btn")
                .forEach(btn => btn.classList.remove("active"));

            button.classList.add("active");

            renderTasks();
        }

        // Clear Completed Tasks

        function clearCompleted() {

            const completedTasks = tasks.filter(task => task.completed);

            if (completedTasks.length === 0) {
                showToast("No completed tasks to clear!");
                return;
            }

            tasks = tasks.filter(task => !task.completed);

            saveTasks();

            renderTasks();

            showToast("Completed tasks cleared!");
        }

        // Render Tasks

        function renderTasks() {

            const taskList = document.getElementById("taskList");

            taskList.innerHTML = "";

            let filteredTasks = tasks.filter(task => {

                if (currentFilter === "active") {
                    return !task.completed;
                }

                if (currentFilter === "completed") {
                    return task.completed;
                }

                return true;

            });

            // Empty state

            if (filteredTasks.length === 0) {

                let message = "Add your first task and start being productive!";

                if (currentFilter === "active") {
                    message = "Great! No pending tasks.";
                }

                if (currentFilter === "completed") {
                    message = "No completed tasks yet.";
                }

                taskList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📝</div>
                        <h5>Nothing here yet!</h5>
                        <p>${message}</p>
                    </div>
                `;

            }

            // Create task elements

            filteredTasks.forEach(task => {

                const taskElement = document.createElement("div");

                taskElement.className =
                    "task-item" + (task.completed ? " completed" : "");

                const checkbox = document.createElement("input");

                checkbox.type = "checkbox";
                checkbox.className = "task-checkbox";
                checkbox.checked = task.completed;

                checkbox.addEventListener("change", () => {
                    toggleTask(task.id);
                });

                const text = document.createElement("span");

                text.className = "task-text";
                text.textContent = task.text;

                const deleteButton = document.createElement("button");

                deleteButton.className = "delete-btn";
                deleteButton.type = "button";
                deleteButton.textContent = "✕";
                deleteButton.setAttribute("aria-label", "Delete task");

                deleteButton.addEventListener("click", () => {
                    deleteTask(task.id);
                });

                taskElement.appendChild(checkbox);
                taskElement.appendChild(text);
                taskElement.appendChild(deleteButton);

                taskList.appendChild(taskElement);

            });

            updateStats();

        }

        // Update Dashboard Statistics

        function updateStats() {

            const total = tasks.length;

            const completed = tasks.filter(
                task => task.completed
            ).length;

            const remaining = total - completed;

            const percentage = total === 0
                ? 0
                : Math.round((completed / total) * 100);

            document.getElementById("progressText")
                .textContent = percentage + "%";

            document.getElementById("completedCount")
                .textContent = completed + "/" + total;

            document.getElementById("progressBar")
                .style.width = percentage + "%";

            document.getElementById("totalCount")
                .textContent = total + (total === 1 ? " task" : " tasks");

            document.getElementById("remainingCount")
                .textContent = remaining +
                (remaining === 1 ? " task remaining" : " tasks remaining");

        }

        // Initial Render

        renderTasks();

    </script>

</body>
</html>
